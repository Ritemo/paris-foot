name: Marges par sport

on:
  workflow_dispatch:        # mesure a la demande (1 credit par competition)
    inputs:
      script:
        description: "outil a lancer (marges ou sonde_sources)"
        default: "marges"

jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mesure
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python tools/${{ inputs.script || 'marges' }}.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonde
          path: sonde/
          if-no-files-found: ignore
