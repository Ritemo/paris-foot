name: Robot

on:
  schedule:
    # toutes les heures de 6h a 23h (UTC) : resultats gratuits a chaque passage,
    # cotes (credits) seulement au premier passage apres 7h30 et 16h30 heure de Paris
    - cron: "17 5-23 * * *"
  workflow_dispatch:        # bouton "Actualiser" de l'appli (cotes + resultats) ou declencheur externe horaire
    inputs:
      force:
        description: "1 = actualiser aussi les cotes (credits), 0 = resultats seulement"
        default: "1"

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot/requirements.txt
      - run: pip install -r robot/requirements.txt
      - name: Combinés et résultats
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || '0' }}
        run: python robot/run.py
      - name: Enregistrer les données
        run: |
          git config user.name "robot-paris-foot"
          git config user.email "robot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Robot $(TZ=Europe/Paris date '+%d/%m %Hh%M')"
          git pull --rebase origin main
          git push
