name: Robot

on:
  schedule:
    - cron: "40 6 * * *"    # vers 8h (heure de Paris, hiver) / 9h (ete)
    - cron: "40 15 * * *"   # vers 17h (hiver) / 18h (ete)
  workflow_dispatch: {}     # bouton "Actualiser" de l'appli ou onglet Actions

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot/requirements.txt
      - run: pip install -r robot/requirements.txt
      - name: Combinés du jour
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python robot/run.py
      - name: Enregistrer les données
        run: |
          git config user.name "robot-paris-foot"
          git config user.email "robot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Combinés $(TZ=Europe/Paris date '+%d/%m %Hh%M')"
          git push
